                            - text: 💥 Glur Café💥 ยืนหนึ่งย่านรังสิต !!!
                            - text: (มีที่จอดรถได้หลายสิบคันไม่ต้องกังวลจ้าา)
                            - text: "📍 google maps : Glur Coffee & Coffee Roaster"
                            - text: 📍 https://goo.gl/maps/7BnfHNdW9qBYfMVZ9
                            - text: ใครกำลังมองหาร้านกาแฟที่สามารถเลือกเมล็ดกาแฟได้ตามชอบ มาเจอกันที่ร้านได้เลยนะครับ
                            - text: ☕️ มีเมล็ดกาแฟให้เลือกทั้งไทยและต่างประเทศ
                            - text: มากกว่า 4️⃣0️⃣ชนิด
                            - text: 🥤เมนูกาแฟ ชา โกโก้ โซดา มีครบหมด
                            - text: 🍰 ขนมเค้กเบเกอรี่ หอม อร่อย สดใหม่
                            - text: 🍲 อาหารคาว ของทานเล่น มาฝากท้องกันที่นี่ได้เลย เมนูมีให้เลือกหลากหลาย มาที่เดียวมีครบหมด
                            - text: 💥ร้านกาแฟเหมาะสำหรับนัดเจอ พบปะเพื่อนเกลอ
                            - text: บรรยากาศสบายๆ วิวสวนธรรมชาติ ร่มรื่น แต่มีห้องแอร์ด้วยนะ ที่สำคัญราคาสบายกระเป๋ามาก กาแฟเริ่มต้น 40 บาท เท่านั้น!!!💥
                            - text: 🧧เปิดบริการทุกวันนะจ้า 🧧
                            - text: ⏱️ เปิด 07:30น. - 17:30น.
